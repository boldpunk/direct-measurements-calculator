# Installed by deploy.sh into /etc/nginx/conf.d/ (http level → every site).
# Images (logos, КП photos, brand logos) travel as base64 inside JSON, which
# adds ~37%. nginx's default 1 MB cap rejected anything above ~700 KB of
# picture with "413 Request Entity Too Large" before it reached the app.
# Matches express.json({ limit: '20mb' }) in server/src/index.js.
client_max_body_size 20m;
