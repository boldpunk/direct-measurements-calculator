server {
    listen 80;
    listen [::]:80;
    server_name mebelflow.uz www.mebelflow.uz;

    root /opt/mebelflow/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Express API — proxy_pass has no path component, so the incoming /api/...
    # URI is forwarded to Express unchanged (matches its app.use('/api/...') routes).
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
    }

    # Static assets: long cache, since Vite fingerprints filenames on build.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — hash-routed app, so every unknown path serves index.html.
    location / {
        try_files $uri /index.html;
    }
}

# `certbot --nginx -d mebelflow.uz -d www.mebelflow.uz` will add the matching
# HTTPS (443) server block and the HTTP->HTTPS redirect below automatically —
# don't hand-add them here before running it (see deploy/README.md).
