<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it env(safe-area-inset-*) is always 0, so
         the bottom navigation sat under the iPhone home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MebelFlow — управление мебельным производством</title>
    <meta name="description" content="Заказы, производство, склад, финансы и коммерческие предложения мебельной компании." />
    <!-- Browser chrome matches the top bar in each theme (src/theme.js keeps
         these in sync when a theme is forced from the profile menu). -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161A21" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved light/dark choice before the first paint (no flash).
      try {
        var t = localStorage.getItem('mebelflow_theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* storage blocked — follow the device setting */ }
    </script>

    <!-- Icons (sources: public/favicon/src) -->
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Installed to the home screen (iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MebelFlow" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <script type="module" src="/src/main.js" defer></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
