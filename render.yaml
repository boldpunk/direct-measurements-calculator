databases:
  - name: mebelflow-db
    databaseName: mebelflow
    user: mebelflow
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: mebelflow-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mebelflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "http://localhost:5173,https://deploy-preview-1--bold-calc.netlify.app"
