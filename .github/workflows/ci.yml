# Runs on every push and PR: the frontend must build, and the API tests must
# pass against a real Postgres with the seed data. deploy.sh pulls `main`, so
# a red run here means "don't deploy this".
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ''

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mebelflow
          POSTGRES_PASSWORD: mebelflow
          POSTGRES_DB: mebelflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mebelflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mebelflow:mebelflow@localhost:5432/mebelflow_test
      JWT_SECRET: ci-only-secret
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run seed
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
