<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Ваш заказ</title>
  <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
  <!--
    The client's view of their order, opened from the link a manager sends
    (Заказ → «Ссылка для клиента»). Reads /api/public/orders/<token>, which
    returns only status, deadline, amount, payments and the КП.
  -->
  <style>
    :root { color-scheme: light dark; --bg: #EEF1F7; --panel: #fff; --text: #111827; --muted: #6B7280; --border: #E5E7EB; --primary: #2563EB; --ok: #16A34A; --okbg: #DCFCE7; --bad: #DC2626; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0F1217; --panel: #161A21; --text: #E5E7EB; --muted: #9CA3AF; --border: #262C36; --primary: #4F8BFF; --ok: #4ADE80; --okbg: #14532D; --bad: #F87171; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 20px 14px 40px; }
    main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--panel); border-radius: 16px; padding: 18px; }
    .head { display: flex; align-items: center; gap: 12px; }
    .head img { max-height: 44px; max-width: 140px; object-fit: contain; }
    .head b { font-size: 17px; }
    h1 { font-size: 21px; margin: 0 0 2px; }
    .muted { color: var(--muted); font-size: 13.5px; }
    .status { display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 999px; background: var(--primary); color: #fff; font-weight: 600; font-size: 13.5px; }
    .steps { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
    .steps li { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; color: var(--muted); }
    .steps li::before { content: ''; flex: none; width: 12px; height: 12px; margin-top: 5px; border-radius: 50%; border: 2px solid var(--border); }
    .steps li.done { color: var(--text); } .steps li.done::before { background: var(--ok); border-color: var(--ok); }
    .steps li.now { color: var(--text); font-weight: 600; } .steps li.now::before { border-color: var(--primary); background: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 25%, transparent); }
    .row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-variant-numeric: tabular-nums; }
    .row + .row { border-top: 1px solid var(--border); }
    .big { font-size: 20px; font-weight: 700; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    .bar { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; margin: 10px 0 4px; }
    .bar i { display: block; height: 100%; background: var(--ok); }
    a.btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px; border-radius: 12px; background: var(--primary); color: #fff; text-decoration: none; font-weight: 600; }
    a.btn.alt { background: transparent; color: var(--primary); border: 1px solid var(--border); }
    .actions { display: grid; gap: 10px; }
    h2 { font-size: 15px; margin: 0 0 8px; }
    .err { text-align: center; padding: 40px 18px; }
  </style>
</head>
<body>
  <main id="root"><div class="card muted" style="text-align:center">Загрузка…</div></main>
  <script>
  (function () {
    var root = document.getElementById('root');
    var token = new URLSearchParams(location.search).get('t') || '';
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function money(n, cur) { return Math.round(Number(n) || 0).toLocaleString('ru-RU') + ' ' + esc(cur); }
    function date(iso) { if (!iso) return '—'; var d = new Date(String(iso).slice(0, 10) + 'T00:00:00'); return isNaN(d) ? esc(iso) : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }); }
    fetch('/api/public/orders/' + encodeURIComponent(token)).then(function (r) { if (!r.ok) throw new Error(); return r.json(); }).then(function (d) {
      var o = d.order, c = d.company, cur = c.currency;
      document.title = 'Заказ #' + o.number + ' · ' + c.name;
      var idx = d.statuses.indexOf(o.status);
      var closed = o.status === 'Завершён' || o.status === 'Готово';
      var steps = d.statuses.filter(function (s) { return s !== 'Новый'; }).map(function (s) {
        var i = d.statuses.indexOf(s);
        var cls = closed || i < idx ? 'done' : i === idx ? 'now' : '';
        return '<li class="' + cls + '">' + esc(s) + '</li>';
      }).join('');
      var pct = o.amount > 0 ? Math.min(100, Math.round(o.paid / o.amount * 100)) : 0;
      var pays = d.payments.map(function (p) { return '<div class="row"><span>' + date(p.date) + '</span><b>' + money(p.amount, cur) + '</b></div>'; }).join('') || '<div class="muted">Оплат пока нет</div>';
      var phone = (c.phone || '').replace(/[^+\d]/g, '');
      var contacts = (phone ? '<a class="btn" href="tel:' + esc(phone) + '">📞 Позвонить в ' + esc(c.name) + '</a><a class="btn alt" href="https://t.me/' + esc(phone.charAt(0) === '+' ? phone : '+' + phone) + '" target="_blank" rel="noopener">✈️ Написать в Telegram</a>' : '') +
        (c.instagram ? '<a class="btn alt" href="https://instagram.com/' + esc(String(c.instagram).replace(/^@|https?:\/\/(www\.)?instagram\.com\//g, '')) + '" target="_blank" rel="noopener">Instagram</a>' : '');
      var kp = d.proposals.map(function (p) { return '<a class="btn alt" href="' + esc(p.pdf) + '" target="_blank" rel="noopener">📄 Коммерческое предложение ' + esc(p.number) + ' · ' + money(p.total, p.currency) + '</a>'; }).join('');
      root.innerHTML =
        '<div class="card head">' + (c.logoUrl ? '<img src="' + esc(c.logoUrl) + '" alt="">' : '') + '<div><b>' + esc(c.name) + '</b>' + (c.address ? '<div class="muted">' + esc(c.address) + '</div>' : '') + '</div></div>' +
        '<div class="card"><h1>' + (o.productType ? esc(o.productType) + ' ' : 'Заказ ') + '#' + o.number + '</h1><div class="muted">' + esc(o.clientName) + '</div>' +
          '<span class="status">' + esc(o.status) + '</span>' +
          '<div class="row" style="margin-top:12px"><span class="muted">Срок готовности</span><b>' + date(o.deadline) + '</b></div>' +
          (steps ? '<ul class="steps">' + steps + '</ul>' : '') + '</div>' +
        '<div class="card"><h2>Оплата</h2>' +
          '<div class="row"><span>Сумма договора</span><b class="big">' + money(o.amount, cur) + '</b></div>' +
          '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
          '<div class="row"><span>Оплачено</span><b class="ok">' + money(o.paid, cur) + '</b></div>' +
          '<div class="row"><span>Осталось</span><b class="' + (o.remaining > 0 ? 'bad' : 'ok') + '">' + (o.remaining > 0 ? money(o.remaining, cur) : 'всё оплачено ✓') + '</b></div>' +
          '<h2 style="margin-top:14px">Платежи</h2>' + pays + '</div>' +
        (kp ? '<div class="card actions">' + kp + '</div>' : '') +
        (contacts ? '<div class="card actions">' + contacts + '</div>' : '') +
        '<div class="muted" style="text-align:center">Страница обновляется по мере работы над заказом</div>';
    }).catch(function () {
      root.innerHTML = '<div class="card err"><h1>Ссылка не работает</h1><p class="muted">Возможно, её отключили или заказ закрыт. Уточните у менеджера.</p></div>';
    });
  })();
  </script>
</body>
</html>
